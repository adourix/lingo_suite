name: lingo_store
description: A modern POS & Inventory Management System built with Flutter.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

   
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.1
  fl_chart: ^1.0.0
  lucide_icons_flutter: ^3.0.5

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^16.2.1

  # Networking
  dio: ^5.9.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Database
  dropdown_search: ^6.0.1
  intl: ^0.20.2
  data_table_2: ^2.6.0
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  path: ^1.9.1

  # PDF & Printing
  pdf: ^3.11.3
  printing: ^5.14.0
  win32: ^5.5.4
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.7.0
  drift_dev: ^2.31.0

flutter:
  uses-material-design: true