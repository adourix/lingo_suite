name: Build macOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter 3.41.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          architecture: arm64
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Enable macOS desktop support
        run: flutter config --enable-macos-desktop

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install/update CocoaPods dependencies
        working-directory: macos
        run: pod install --repo-update

      - name: Build macOS app
        run: flutter build macos --release

      - name: Locate build output
        id: locate_app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app at: $APP_PATH"

      - name: Ad-hoc codesign the app
        run: |
          codesign --force --deep --sign - "${{ steps.locate_app.outputs.app_path }}"
          codesign --verify --deep --strict --verbose=2 "${{ steps.locate_app.outputs.app_path }}"

      # IMPORTANT: actions/upload-artifact's built-in zipping does NOT
      # reliably preserve macOS symlinks (Versions/Current -> A) or
      # executable permission bits inside .app bundles/frameworks, which
      # corrupts the code signature on download ("bundle format is
      # ambiguous" / "code signature is not valid"). We zip it ourselves
      # with `ditto`, which is Apple's own tool and preserves all of that
      # correctly, then upload the single .zip file (not the raw .app
      # folder) so upload-artifact just stores it as-is without re-zipping
      # its internals.
      - name: Package app with ditto (preserves symlinks & permissions)
        id: package_app
        run: |
          APP_PATH="${{ steps.locate_app.outputs.app_path }}"
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          ZIP_PATH="$APP_DIR/${APP_NAME%.app}.zip"
          cd "$APP_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "$(basename "$ZIP_PATH")"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "Packaged: $ZIP_PATH"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: ${{ steps.package_app.outputs.zip_path }}
          if-no-files-found: error
